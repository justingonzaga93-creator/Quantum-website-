<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Psycho Squad</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --primary: #00ff88;
      --text: #e0e0e0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .settings-container {
      background: rgba(26, 26, 26, 0.95);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 90px;
      margin-bottom: 15px;
    }

    .avatar {
      width: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
      cursor: pointer;
    }

    input, button {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      width: 100%;
    }

    button {
      background: var(--primary);
      font-weight: bold;
      cursor: pointer;
    }

    label {
      display: block;
      margin-top: 15px;
    }

    footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>

<body>

<div class="settings-container">
  <img src="images/Logo.jpg" class="logo">

  <h1>Settings</h1>
  <p style="color:#00ff88;">Account & Profile</p>

  <!-- Google Sign In -->
  <div id="g_id_signin"></div>

  <!-- Profile -->
  <div class="profile">
    <img id="userPic" class="avatar" onclick="uploadPic()">
    <h3 id="userName"></h3>
    <p id="userEmail"></p>
  </div>

  <!-- Edit Name -->
  <input type="text" id="nameInput" placeholder="Edit your name">
  <button onclick="saveName()">💾 Save Name</button>

  <!-- Upload Image -->
  <input type="file" id="fileInput" style="display:none" accept="image/*">

  <!-- Notifications -->
  <label>
    <input type="checkbox" id="notif"> Enable Notifications
  </label>

  <!-- Logout -->
  <button onclick="logout()">🚪 Logout</button>

  <footer>
    &copy; 2026 Psycho Squad
  </footer>
</div>

<script>
window.onload = function() {

  google.accounts.id.initialize({
    client_id: "14252641032-jlvf48i6tmnqjg8ll7ornq3hr061a3kk.apps.googleusercontent.com",
    callback: handleCredentialResponse
  });

  google.accounts.id.renderButton(
    document.getElementById("g_id_signin"),
    { theme: "filled_black", size: "large", width: 250 }
  );

  google.accounts.id.prompt();

  loadUser();
};

// Load user
function loadUser() {
  const name = localStorage.getItem("userName");
  const email = localStorage.getItem("userEmail");
  const pic = localStorage.getItem("userPic");

  if (name) {
    document.getElementById("userName").innerText = name;
    document.getElementById("userEmail").innerText = email;
    document.getElementById("userPic").src = pic;

    document.getElementById("g_id_signin").style.display = "none";
  }

  document.getElementById("notif").checked =
    localStorage.getItem("notifications") === "true";
}

// Google login
function handleCredentialResponse(response) {
  const base64Url = response.credential.split('.')[1];
  const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
  const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
  ).join(''));

  const user = JSON.parse(jsonPayload);

  localStorage.setItem("userName", user.name);
  localStorage.setItem("userEmail", user.email);
  localStorage.setItem("userPic", user.picture);

  alert("✅ Welcome " + user.name);
  location.reload();
}

// Save name
function saveName() {
  const newName = document.getElementById("nameInput").value;

  if (newName.trim() === "") {
    alert("Enter a valid name!");
    return;
  }

  localStorage.setItem("userName", newName);
  document.getElementById("userName").innerText = newName;

  alert("✅ Name updated!");
}

// Upload pic
function uploadPic() {
  document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change", function() {
  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    localStorage.setItem("userPic", e.target.result);
    document.getElementById("userPic").src = e.target.result;
  };

  reader.readAsDataURL(file);
});

// Save notifications
document.getElementById("notif").addEventListener("change", function() {
  localStorage.setItem("notifications", this.checked);
});

// Logout
function logout() {
  localStorage.clear();
  alert("Logged out!");
  location.reload();
}
</script>

</body>
</html>
