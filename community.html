<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community - psycho</title>
<link rel="stylesheet" href="style.css">
<style>
body { font-family: Arial; background: linear-gradient(to bottom right,#0f2027,#203a43,#2c5364); color:white; display:flex; flex-direction:column; align-items:center; min-height:100vh; margin:0; padding:20px;}
.community-page { text-align:center; max-width:500px; width:100%; background: rgba(0,0,0,0.6); padding:30px; border-radius:20px; box-shadow:0 0 20px rgba(0,0,0,0.5);}
.community-page img { width:100px; border-radius:50%; margin-bottom:10px; }
h1 { color:#ffcc00; margin-bottom:10px;}
p { margin-bottom:20px;}
.btn { display:inline-block; padding:10px 20px; background-color:green; color:white; text-decoration:none; border-radius:8px; font-weight:bold; margin:5px; transition:0.3s; cursor:pointer;}
.btn:hover{background-color:blue; transform:scale(1.05);}
</style>
</head>
<body>

<div class="community-page">
    <h1>Welcome to L3ARN Community!</h1>
    <img id="user-pic" src="" alt="Profile Picture">
    <div id="user-name" style="font-weight:bold; font-size:1.2em;"></div>
    <div id="user-email" style="color:lightgray;"></div>
    <p>Now you can access exclusive mods, join discussions, and more.</p>
    
    <a href="profile.html" class="btn">View Profile</a>
    <a href="index.html" class="btn">Back to Home</a>
</div>


<script>
const name = localStorage.getItem("userName");
const email = localStorage.getItem("userEmail");
const pic = localStorage.getItem("userPic");

if(name && email && pic){
    document.getElementById("user-name").textContent = name;
    document.getElementById("user-email").textContent = email;
    document.getElementById("user-pic").src = pic;
}else{
    window.location.href = "squadlogo.html";
}
</script>
</body>
</html>
