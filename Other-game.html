<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breaker Time Paddle + Multiplier</title>
<style>
body{
  margin:0;
  background:#000;
  color:#0ff;
  font-family:monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
}
canvas{border:5px solid #0ff;margin-top:10px;}
button{padding:10px 20px;margin:5px;font-size:16px;}
#gameOverUI{display:none;}
</style>
</head>
<body>

<h2>RETRO BREAKER</h2>
<div>
Score: <span id="score">0</span> |
High: <span id="high">0</span> |
Level: <span id="level">1</span>
</div>

<canvas id="gameCanvas" width="480" height="640"></canvas>

<div>
<button id="btnLeft"></button>
<button id="btnRight"></button>
</div>

<div id="gameOverUI">
<h2 style="color:red;">GAME OVER</h2>
<button id="restartBtn">RESTART</button>
<a href="index.html"><button>HOME</button></a>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let paddleWidth = 120;
let paddleX = canvas.width/2 - 60;
const paddleY = canvas.height - 25;

const ballRadius = 7;
let balls = [];
let powerUps = [];

let score = 0;
let highScore = localStorage.getItem("hs") || 0;
let level = 0;
let speed = 3;
let gameOver = false;

document.getElementById("high").textContent = highScore;

const rows = 10, cols = 15;
const bw = 26, bh = 14, pad = 4, offT = 60, offL = 15;

let bricks = [];
const levels = [Array(10).fill().map(()=>Array(15).fill(1))];

// --- BRICKS ---
function createBricks(){
  bricks = [];
  let layout = levels[level % levels.length];
  for(let c=0;c<cols;c++){
    bricks[c]=[];
    for(let r=0;r<rows;r++){
      let type = layout[r][c];
      if(type===1 && Math.random()<0.2) type=3; // ability brick 20%
      if(type===1 && Math.random()<0.05) type=4; // rare paddle expand 5%
      bricks[c][r]={x:0,y:0,status:type};
    }
  }
}

// --- BALL INIT ---
function initBall(){
  balls=[{
    x:canvas.width/2,
    y:canvas.height-100,
    dx:speed*(Math.random()<0.5?1:-1),
    dy:-speed
  }];
}

// --- DRAW BRICKS ---
function drawBricks(){
  bricks.forEach((col,c)=>{
    col.forEach((b,r)=>{
      if(!b.status) return;
      let x = c*(bw+pad)+offL;
      let y = r*(bh+pad)+offT;
      b.x = x; b.y = y;
      ctx.fillStyle = b.status===2?"#777":(b.status===4?"#0f0":"#0ff");
      ctx.fillRect(x,y,bw,bh);
    });
  });
}

// --- COLLISION ---
function collision(ball){
  bricks.forEach(col=>{
    col.forEach(b=>{
      if(!b.status) return;
      if(ball.x>b.x && ball.x<b.x+bw && ball.y>b.y && ball.y<b.y+bh){
        let prevX = ball.x-ball.dx;
        let prevY = ball.y-ball.dy;
        if(prevY<=b.y||prevY>=b.y+bh) ball.dy*=-1;
        else ball.dx*=-1;

        if(b.status===3 && Math.random()<0.2){ // 20% chance to multiply ball
          balls.push({...ball, dx:-ball.dx, dy:-ball.dy});
        }
        if(b.status===4 && Math.random()<0.05){ // 5% chance paddle expand
          paddleWidth *= 1.2;
          setTimeout(()=>{paddleWidth/=1.2},5000); // 5s duration
        }
        if(b.status!==2) { b.status=0; score+=10; document.getElementById("score").textContent=score;}
      }
    });
  });
}

// --- POWERUPS ---
function spawnPowerUp(x,y){
  powerUps.push({x:x,y:y,dy:2,type:Math.floor(Math.random()*2)});
}
function drawPowerUps(){
  powerUps.forEach((p,i)=>{
    p.y+=p.dy;
    ctx.fillStyle = p.type===0?"#0f0":"#00f";
    ctx.fillRect(p.x-8,p.y-8,16,16);
    if(p.y>paddleY && p.x>paddleX && p.x<paddleX+paddleWidth){
      if(p.type===0) paddleWidth*=1.2;
      if(p.type===1 && balls.length<5) balls.push({...balls[0],dx:-balls[0].dx});
      setTimeout(()=>{paddleWidth/=1.2},5000);
      powerUps.splice(i,1);
    }
    if(p.y>canvas.height) powerUps.splice(i,1);
  });
}

// --- BALL UPDATE ---
function updateBalls(){
  balls.forEach((ball,i)=>{
    ball.x+=ball.dx;
    ball.y+=ball.dy;
    if(ball.x<ballRadius||ball.x>canvas.width-ballRadius) ball.dx*=-1;
    if(ball.y<ballRadius) ball.dy*=-1;

    if(ball.y+ballRadius>=paddleY && ball.x>paddleX && ball.x<paddleX+paddleWidth){
      ball.dy=-Math.abs(ball.dy);
    }
    collision(ball);
    if(ball.y>canvas.height) balls.splice(i,1);
  });
}

// --- LEVEL CHECK ---
function checkLevel(){
  if(!bricks.flat().some(b=>b.status===1||b.status===3||b.status===4)){
    level++;
    createBricks();
    initBall();
  }
}

// --- DRAW LOOP ---
function draw(){
  if(gameOver) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBricks();
  updateBalls();
  drawPowerUps();
  checkLevel();

  balls.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x,b.y,ballRadius,0,Math.PI*2);
    ctx.fillStyle="#ff0"; ctx.fill();
  });

  ctx.fillStyle="#fff"; ctx.fillRect(paddleX,paddleY,paddleWidth,10);

  if(left) paddleX-=6;
  if(right) paddleX+=6;
  if(paddleX<0)paddleX=0;
  if(paddleX+paddleWidth>canvas.width)paddleX=canvas.width-paddleWidth;

  if(balls.length===0){
    gameOver=true;
    document.getElementById("gameOverUI").style.display="block";
    if(score>highScore) localStorage.setItem("hs",score);
  }

  requestAnimationFrame(draw);
}

// --- CONTROLS ---
let left=false,right=false;
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key==="ArrowRight") e.preventDefault();
  if(e.key==="ArrowLeft") left=true;
  if(e.key==="ArrowRight") right=true;
});
document.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft") left=false;
  if(e.key==="ArrowRight") right=false;
});
document.getElementById("btnLeft").ontouchstart=()=>left=true;
document.getElementById("btnLeft").ontouchend=()=>left=false;
document.getElementById("btnRight").ontouchstart=()=>right=true;
document.getElementById("btnRight").ontouchend=()=>right=false;

// --- RESTART ---
document.getElementById("restartBtn").onclick=()=>{
  score=0; level=0; paddleWidth=120; gameOver=false;
  document.getElementById("gameOverUI").style.display="none";
  document.getElementById("score").textContent=0;
  createBricks(); initBall(); draw();
}

// --- START ---
createBricks();
initBall();
draw();
</script>
</body>
</html>
